name: CI/CD Pipeline - Multi-Agent Finance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Lint & Test ──────────────────────────────────────────
  backend-ci:
    name: Backend CI (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify imports (smoke test)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          python -c "from main import app; print('FastAPI app imports OK')"
          python -c "from data_market import MarketDataProvider; print('MarketDataProvider OK')"
          python -c "from news_provider import NewsProvider; print('NewsProvider OK')"
          python -c "from rag_retriever import get_document_store; print('RAG Retriever OK')"
          python -c "from agents_specialists import TechnicalAgent, FundamentalAgent, SentimentAgent; print('All agents OK')"
          python -c "from agents_synthesis import SynthesisAgent; print('SynthesisAgent OK')"

      - name: Start backend & health check
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/ || exit 1
          echo "Backend health check PASSED"

  # ─── Frontend Lint & Build ────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint with oxlint
        run: npm run lint

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 7

  # ─── Integration Check ────────────────────────────────────────────
  integration-check:
    name: Integration Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: All checks passed
        run: |
          echo "✅ Backend CI passed"
          echo "✅ Frontend CI passed"
          echo "✅ Build artifact uploaded"
          echo "🚀 Ready for deployment"
